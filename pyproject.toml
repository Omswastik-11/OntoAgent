[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ontoagent"
version = "0.1.0"
description = "Ontology-grounded multi-agent copilot for enterprise operations data"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "OntoAgent Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "sqlglot>=23.0.0",
    "rapidfuzz>=3.8.0",
    "faker>=24.0.0",
    "tenacity>=8.2.3",
    "psycopg[binary,pool]>=3.1.18",
    "neo4j>=5.19.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "gradio>=4.25.0",
    "fastmcp>=0.1.0",
    "sentence-transformers>=2.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
