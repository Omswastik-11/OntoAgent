version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ontoagent_postgres
    environment:
      POSTGRES_DB: ontoagent
      POSTGRES_USER: ontoagent_admin
      POSTGRES_PASSWORD: admin_secret
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontoagent_admin -d ontoagent"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: ontoagent_neo4j
    environment:
      NEO4J_AUTH: neo4j/ontoagent_neo4j_password
      NEO4J_PLUGINS: '[]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  neo4j_data:
